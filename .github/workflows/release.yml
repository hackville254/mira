# Release — distribution DIRECTE (GitHub Releases) : macOS + Linux.
#
# PÉRIMÈTRE
# ---------
# Ce workflow couvre les canaux où l'app se met à jour ELLE-MÊME via
# `tauri-plugin-updater` :
#   - macOS : .app / .dmg (signature ad-hoc) + archive de MAJ (.app.zip + .sig)
#   - Linux : .AppImage / .deb / .rpm + signature de l'archive de MAJ
#
# Windows N'EST PAS ici : il est distribué via Microsoft Store (MSIX), où c'est
# le Store qui gère les mises à jour (voir src-tauri/msix/ + ENGINEERING_LOG).
# Le build Windows hors Store reste possible manuellement (workflow_dispatch).
#
# SIGNATURES
# ----------
# 1. Update signature (minisign) : OBLIGATOIRE pour l'auto-updater Tauri, sur
#    macOS ET Linux. Indépendante des signatures OS. Fournie via
#    TAURI_SIGNING_PRIVATE_KEY (+ password). C'est elle qui « signe » le
#    `latest.json`.
# 2. macOS : signature ad-hoc gratuite (`APPLE_SIGNING_IDENTITY="-"`), pas de
#    notarisation (pas de compte Apple Developer). L'utilisateur retire la
#    quarantaine au 1er lancement (voir docs). Gatekeeper affichera « développeur
#    non identifié » — contournable via Clic droit > Ouvrir.
# 3. Windows (hors Store) : non signé ; SmartScreen reste visible. Non utilisé en
#    production (le Store est le canal officiel Windows).

name: Release

# Déclencheurs :
#   - pull_request -> main : VÉRIFICATION uniquement (les builds macOS/Linux
#     doivent compiler avant merge). Le job `publish` est explicitement désactivé
#     hors tags, donc aucune release n'est créée depuis une PR.
#   - push d'un tag v* : release complète (artefacts + latest.json).
#   - workflow_dispatch : build manuel, sans publication (ref = branche).
on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS — build universel, ad-hoc, + artefacts de mise à jour
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      # Signature ad-hoc : « - » = pas de certificat Apple. Suffisant pour
      # supprimer l'erreur « app endommagée » une fois la quarantaine retirée.
      - name: Build (macOS, universal, ad-hoc)
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Linux — AppImage / deb / rpm + signature de MAJ
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install deps
        run: npm ci

      - name: Build (Linux)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Publication — release GitHub + latest.json pour l'auto-updater
  # ---------------------------------------------------------------------------
  publish:
    # Uniquement sur tag : une PR ne doit JAMAIS publier de release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.sig' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist

      # `tauri build` produit les archives de MAJ + `.sig`, mais PAS le manifeste
      # statique interrogé par l'updater. Sans lui, l'endpoint
      #   https://github.com/hackville254/mira/releases/latest/download/latest.json
      # renvoie 404 et l'app se croit à jour pour toujours.
      # Le script échoue si une archive/signature manque ou si la version du tag
      # ne correspond pas à tauri.conf.json (manifeste partiel = updater cassé).
      - name: Generate latest.json
        run: |
          python3 scripts/gen-latest-json.py \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --dist dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # draft: la release ne devient « latest » (donc visible par l'updater)
          # qu'après publication manuelle depuis l'UI GitHub. Volontaire pour
          # garder un contrôle humain avant de pousser une MAJ à tous les users.
          draft: true
          generate_release_notes: true
