# Release — distribution DIRECTE (GitHub Releases) : macOS + Windows + Linux.
#
# PÉRIMÈTRE
# ---------
# Ce workflow couvre les canaux où l'app se met à jour ELLE-MÊME via
# `tauri-plugin-updater` :
#   - macOS  : .app / .dmg (signature ad-hoc) + archive de MAJ (.app.tar.gz + .sig)
#   - Windows: .msi + installeur NSIS .exe + archive de MAJ + .sig
#   - Linux  : .AppImage / .deb / .rpm + signature de l'archive de MAJ
#
# Le Microsoft Store reste un canal SÉPARÉ (workflow `windows-msix.yml`) : il
# utilise la feature Rust `msstore`, n'embarque PAS l'updater Tauri (le Store
# gère les mises à jour), et ne doit pas être impacté par ce fichier.
#
# SIGNATURES
# ----------
# 1. Update signature (minisign) : OBLIGATOIRE pour l'auto-updater Tauri, sur
#    macOS, Windows ET Linux. Indépendante des signatures OS. Fournie via
#    TAURI_SIGNING_PRIVATE_KEY (+ password). C'est elle qui « signe » le
#    `latest.json`.
# 2. macOS : signature ad-hoc gratuite (`APPLE_SIGNING_IDENTITY="-"`), pas de
#    notarisation (pas de compte Apple Developer). L'utilisateur retire la
#    quarantaine au 1er lancement (voir DISTRIBUTION.md). Gatekeeper affichera
#    « développeur non identifié » — contournable via Clic droit > Ouvrir.
# 3. Windows (hors Store) : NON signé (aucun certificat). SmartScreen affiche un
#    avertissement — accepté (voir DISTRIBUTION.md). Aucun secret `WINDOWS_*`
#    requis : le build doit réussir sans certificat.
#
# Validé sur la base de la doc officielle :
#   - https://v2.tauri.app/plugin/updater/   (format `platforms`, clés OS-ARCH)
#   - https://v2.tauri.app/distribute/       (canaux de distribution)

name: Release

# Déclencheurs :
#   - pull_request -> main : VÉRIFICATION uniquement (les builds macOS/Windows/
#     Linux doivent compiler avant merge). Le job `publish` est explicitement
#     désactivé hors tags, donc aucune release n'est créée depuis une PR.
#   - push d'un tag v* : release complète (artefacts + latest.json).
#   - workflow_dispatch : build manuel, sans publication (ref = branche).
on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS — deux builds SÉPARÉS (Apple Silicon aarch64 + Intel x86_64)
  # ---------------------------------------------------------------------------
  # On ne produit PAS de build universel : le site et l'updater exposent deux
  # téléchargements distincts (Silicon / Intel), chacun avec SON archive de MAJ
  # et SA signature. `latest.json` déclare donc `darwin-aarch64` et
  # `darwin-x86_64` comme deux entrées indépendantes pointant vers deux fichiers.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64          # Apple Silicon (M1/M2/M3…)
            target: aarch64-apple-darwin
          - arch: x86_64           # Apple Intel
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}

      - name: Install deps
        run: npm ci

      # Le sidecar Cline (`src-tauri/cline-sidecar/dist/index.mjs`) est une
      # ressource déclarée dans tauri.conf.json. `tauri build` échoue si elle
      # manque ; le `beforeBuildCommand` ne la construit PAS. On la construit
      # donc explicitement, sur CHAQUE plateforme.
      - name: Build sidecar
        run: npm run build:sidecar

      # Signature ad-hoc : « - » = pas de certificat Apple. Suffisant pour
      # supprimer l'erreur « app endommagée » une fois la quarantaine retirée.
      - name: Build (macOS ${{ matrix.arch }}, ad-hoc)
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      # Tauri nomme l'archive de MAJ `Mira.app.tar.gz` SANS y inclure l'arch ni
      # la version (doc : https://v2.tauri.app/plugin/updater/). Les deux builds
      # macOS produiraient donc le MÊME nom et s'écraseraient au flatten. On les
      # renomme par arch AVANT upload : `Mira_<version>_<arch>.app.tar.gz(.sig)`.
      # Sans cela, impossible de servir deux entrées darwin-* distinctes.
      - name: Rename macOS updater artifacts by arch
        run: |
          set -euo pipefail
          macos_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          version="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          for f in "$macos_dir"/*.app.tar.gz "$macos_dir"/*.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            stem="$(basename "$f" .app.tar.gz)"
            new="Mira_${version}_${{ matrix.arch }}.app.tar.gz"
            [ "${f##*.}" = "sig" ] && new="${new}.sig"
            mv "$f" "$macos_dir/$new"
          done
          ls -la "$macos_dir"

      # Vérif bloquante : chaque arch doit produire son archive de MAJ + .sig,
      # sinon `latest.json` serait incomplet (et `gen-latest-json.py` échouerait).
      - name: Verify macOS ${{ matrix.arch }} updater artifacts
        run: |
          set -euo pipefail
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -la "$base/dmg" "$base/macos"
          test -n "$(find "$base/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)" \
            || { echo "archive .app.tar.gz manquante pour ${{ matrix.arch }}"; exit 1; }
          test -n "$(find "$base/macos" -maxdepth 1 -name '*.app.tar.gz.sig' -print -quit)" \
            || { echo "signature .app.tar.gz.sig manquante pour ${{ matrix.arch }} (TAURI_SIGNING_PRIVATE_KEY ?)"; exit 1; }

      - name: Upload macOS ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          # `error` (et non `warn`) : un artefact manquant DOIT faire échouer le
          # build plutôt que de produire une release silencieusement incomplète.
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — hors Store : .msi + NSIS .exe + artefacts de mise à jour
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Build sidecar
        run: npm run build:sidecar

      # Build Windows SANS signature OS (SmartScreen = avertissement accepté).
      # Tauri produit, pour `createUpdaterArtifacts: true` :
      #   - bundle/msi/*.msi      + *.msi.sig      (installeur + sig de MAJ)
      #   - bundle/nsis/*.exe     + *.exe.sig      (installeur NSIS = archive de MAJ)
      # Le canal Windows Store n'utilise PAS cette sortie (voir windows-msix.yml).
      - name: Build (Windows, unsigned)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Vérif bloquante : sans l'installeur NSIS ET sa signature, l'updater
      # Windows ne peut pas fonctionner (le `latest.json` sera rejeté ou le
      # téléchargement échouera silencieusement). On échoue tôt et fort.
      - name: Verify Windows updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*' -ErrorAction SilentlyContinue
          if (-not $nsis) { throw 'Aucun artefact NSIS produit (bundle/nsis vide).' }
          $sig = @($nsis | Where-Object { $_.Name -like '*.sig' })
          $installer = @($nsis | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.nsis.zip' })
          if ($installer.Count -eq 0) { throw 'Installeur NSIS/archive de MAJ absent (ni .exe ni .nsis.zip).' }
          if ($sig.Count -eq 0) { throw 'Signature de MAJ Windows absente (TAURI_SIGNING_PRIVATE_KEY manquante ?).' }
          Get-ChildItem 'src-tauri/target/release/bundle/msi/*' | ForEach-Object { Write-Host "MSI: $($_.Name)" }
          Write-Host "NSIS: $($installer.Name -join ', ')  |  SIG: $($sig.Name -join ', ')"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux — AppImage / deb / rpm + signature de MAJ
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install deps
        run: npm ci

      - name: Build sidecar
        run: npm run build:sidecar

      - name: Build (Linux)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publication — release GitHub + latest.json pour l'auto-updater
  # ---------------------------------------------------------------------------
  publish:
    # Uniquement sur tag : une PR ne doit JAMAIS publier de release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.sig' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \
               -o -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' \) \
            -exec cp {} dist/ \;
          ls -la dist

      # `tauri build` produit les archives de MAJ + `.sig`, mais PAS le manifeste
      # statique interrogé par l'updater. Sans lui, l'endpoint
      #   https://github.com/hackville254/mira/releases/latest/download/latest.json
      # renvoie 404 et l'app se croit à jour pour toujours.
      # Le script échoue si une archive/signature manque ou si la version du tag
      # ne correspond pas à tauri.conf.json (manifeste partiel = updater cassé).
      - name: Generate latest.json
        run: |
          python3 scripts/gen-latest-json.py \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --dist dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # NON-draft : l'updater interroge `/releases/latest/download/latest.json`
          # et « latest » ne résout que les releases PUBLIÉES. Une release en
          # `draft` est invisible → l'auto-update ne se déclencherait jamais.
          # Le tag `v*` est le point de contrôle humain (voir DISTRIBUTION.md).
          draft: false
          generate_release_notes: true
