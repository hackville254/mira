[package]
name = "mira"
version = "0.1.4"
description = "Mira — AI-native code editor"
authors = ["Mira IDE"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
url = "2"
dpi = "0.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "process", "io-util", "time"] }
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json"] }
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
regex = "1"

[dev-dependencies]
# `macros` : nécessaire aux tests `#[tokio::test]` (routage des réponses de
# commande). On ne l'ajoute PAS aux dépendances de production pour ne pas
# embarquer la machinerie de macro inutilement.
tokio = { version = "1", features = ["macros"] }

[profile.release]
opt-level   = "z"      # optimize for size (not speed)
lto         = "thin"   # cross-crate dead-code elimination
codegen-units = 1      # single codegen unit lets LLVM optimise across more code
strip       = true     # strip debug symbols from the binary
panic       = "abort"  # removes unwinding machinery (~200 KB)

